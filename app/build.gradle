plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mediaunlock.hook'
    compileSdk 34

    defaultConfig {
        applicationId "com.mediaunlock.hook"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Xposed API：仅编译期依赖，不打进 APK
    compileOnly 'de.robv.android.xposed:api:82'
}